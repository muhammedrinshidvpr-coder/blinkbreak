name: Bug report
description: Something in BlinkBreak isn't working right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings
        2. ...
  - type: input
    id: version
    attributes:
      label: BlinkBreak version
      placeholder: v0.1.0
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
