name: Release

# Push a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to publish
# a GitHub Release with the Windows installer attached. Release notes come from
# that version's section in CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Check tag matches app version
        shell: bash
        run: |
          app="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$app" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version $app"; exit 1
          fi
      - name: Build Tauri app (NSIS installer)
        run: npm run tauri build
      - name: Checksum + release notes from CHANGELOG.md
        shell: bash
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" src-tauri/target/release/bundle/nsis > notes.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
