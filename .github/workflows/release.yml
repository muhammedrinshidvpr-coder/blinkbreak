name: Release

# Push a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to publish
# a GitHub Release with the Windows, macOS, and Linux installers attached.
# Release notes come from that version's section in CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: release-windows-x64
            out-dir: src-tauri/target/release/bundle/nsis
          - os: macos-latest
            bundles: dmg
            artifact: release-macos-arm64
            out-dir: src-tauri/target/release/bundle/dmg
          - os: macos-15-intel
            bundles: dmg
            artifact: release-macos-x64
            out-dir: src-tauri/target/release/bundle/dmg
          - os: ubuntu-22.04
            bundles: deb,appimage
            artifact: release-linux-x64
            out-dir: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Check tag matches app version
        shell: bash
        run: |
          app="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$app" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version $app"; exit 1
          fi
      - name: Verify Apple signing secrets are configured
        if: matrix.os == 'macos-latest' || matrix.os == 'macos-15-intel'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_BASE64; do
            if [ -z "${!name}" ]; then echo "Missing required GitHub secret: $name"; exit 1; fi
          done
      - name: Prepare Apple notarization key
        if: matrix.os == 'macos-latest' || matrix.os == 'macos-15-intel'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_BASE64" | base64 -D > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Build signed and notarized macOS app
        if: matrix.os == 'macos-latest' || matrix.os == 'macos-15-intel'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Build Windows or Linux app
        if: matrix.os != 'macos-latest' && matrix.os != 'macos-15-intel'
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Upload platform bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.out-dir }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download all platform bundles
        uses: actions/download-artifact@v7
        with:
          path: dist-bundles
          merge-multiple: true
      - name: Checksum + release notes from CHANGELOG.md
        shell: bash
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" dist-bundles > notes.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: |
            dist-bundles/**/*.exe
            dist-bundles/**/*.dmg
            dist-bundles/**/*.deb
            dist-bundles/**/*.AppImage
            dist-bundles/SHA256SUMS.txt
