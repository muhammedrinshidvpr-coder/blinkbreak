name: Release

# Push a version tag (e.g. `git tag v0.5.0 && git push origin v0.5.0`) to publish
# a GitHub Release with the Windows, macOS, and Linux installers attached.
# Release notes come from that version's section in CHANGELOG.md.
# macOS signing: with all six APPLE_* secrets set, DMGs are Developer ID signed and
# notarized. With none set, they are ad-hoc signed (free; users approve the app once
# in Privacy & Security). A partial set fails the build instead of guessing.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: release-windows-x64
            files: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundles: dmg
            artifact: release-macos-arm64
            files: src-tauri/target/release/bundle/dmg/*.dmg
          - os: macos-15-intel
            bundles: dmg
            artifact: release-macos-x64
            files: src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            bundles: deb,appimage
            artifact: release-linux-x64
            files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Check tag matches app version
        shell: bash
        run: |
          app="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$app" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version $app"; exit 1
          fi
      - name: Choose macOS signing mode
        id: signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          present=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_BASE64; do
            if [ -n "${!name}" ]; then present=$((present + 1)); fi
          done
          if [ "$present" -eq 6 ]; then
            echo "All Apple secrets set: building a signed and notarized DMG."
            echo "mode=notarized" >> "$GITHUB_OUTPUT"
          elif [ "$present" -eq 0 ]; then
            echo "No Apple secrets set: building an ad-hoc signed DMG (not notarized)."
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Only $present of the 6 Apple signing secrets are set. Set all of them or none."; exit 1
          fi
      - name: Prepare Apple notarization key
        if: steps.signing.outputs.mode == 'notarized'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_BASE64" | base64 -D > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Build signed and notarized macOS app
        if: steps.signing.outputs.mode == 'notarized'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Build ad-hoc signed macOS app
        if: steps.signing.outputs.mode == 'adhoc'
        env:
          # "-" is codesign's ad-hoc identity: Apple Silicon refuses to run unsigned downloads.
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Build Windows or Linux app
        if: runner.os != 'macOS'
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Install and launch the built app
        shell: bash
        env:
          SMOKE_MACOS_SIGNING: ${{ steps.signing.outputs.mode }}
        run: bash scripts/smoke-test.sh src-tauri/target/release/bundle
      - name: Upload platform bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download all platform bundles
        uses: actions/download-artifact@v7
        with:
          path: dist-bundles
          merge-multiple: true
      - name: Give installers plain download names
        shell: bash
        run: node scripts/release-assets.mjs "${GITHUB_REF_NAME#v}" dist-bundles release
      - name: Checksum + release notes from CHANGELOG.md
        shell: bash
        env:
          # Matches the build job: the DMGs are notarized only when the Apple secrets exist.
          MACOS_NOTARIZED: ${{ secrets.APPLE_API_KEY_BASE64 != '' }}
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" release > notes.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: BlinkBreak ${{ github.ref_name }}
          body_path: notes.md
          files: release/*
