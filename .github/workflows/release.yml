name: Release

# Push a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to publish
# a GitHub Release with the Windows, macOS, and Linux installers attached.
# Release notes come from that version's section in CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            out-dir: src-tauri/target/release/bundle/nsis
          - os: macos-latest
            bundles: dmg
            out-dir: src-tauri/target/release/bundle/dmg
          - os: ubuntu-22.04
            bundles: deb,appimage
            out-dir: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Check tag matches app version
        shell: bash
        run: |
          app="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$app" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version $app"; exit 1
          fi
      - name: Build Tauri app
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Upload platform bundles
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: ${{ matrix.out-dir }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download all platform bundles
        uses: actions/download-artifact@v7
        with:
          path: dist-bundles
          merge-multiple: true
      - name: Checksum + release notes from CHANGELOG.md
        shell: bash
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" dist-bundles > notes.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: |
            dist-bundles/**/*.exe
            dist-bundles/**/*.dmg
            dist-bundles/**/*.deb
            dist-bundles/**/*.AppImage
            dist-bundles/SHA256SUMS.txt
